<!DOCTYPE html>
<html>
  <head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    <base href="/Portfolio_Flutter_25/" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta
      name="description"
      content="Personal portfolio for Raül Lama - 2025"
    />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="portfolio_2025" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.ico" />

    <title>portfolio_2025</title>
    <link rel="manifest" href="manifest.json" />
  </head>
  <body>
      <!-- Loader Spinner -->
      <div id="custom-loader" style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:#181818;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;">
        <div style="margin-bottom:24px;">
          <img src="assets/imagen_raul/foto_perfil.jpeg" alt="Raül Lama" style="width:80px;height:80px;border-radius:50%;object-fit:cover;box-shadow:0 0 16px #fff2;" onerror="this.style.display='none'" />
        </div>
        <div style="width:48px;height:48px;border:6px solid #fff;border-top:6px solid #a020f0;border-radius:50%;animation:spin 1s linear infinite;"></div>
        <div style="color:#fff;font-family:Poppins,sans-serif;font-size:18px;margin-top:24px;letter-spacing:1px;">Cargando...</div>
      </div>
      <script>
        // Spinner animation
        var style = document.createElement('style');
        style.innerHTML = '@keyframes spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}';
        document.head.appendChild(style);
        // Ocultar loader cuando Flutter inicialice
        window.addEventListener('flutter-first-frame', function() {
          var loader = document.getElementById('custom-loader');
          if(loader) loader.style.display = 'none';
        });
      </script>
      <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
